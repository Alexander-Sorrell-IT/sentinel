[project]
name = "sentinel"
version = "0.1.0"
description = "Adversarial reliability testing for agentic workflows — UiPath AgentHack, Track 3 (Test Cloud)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
    "requests>=2",
]

[project.optional-dependencies]
sut = ["crewai>=0.80"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sentinel*", "sut*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
